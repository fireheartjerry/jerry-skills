<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style>
:root{--bg:#fafaf9;--fg:#1c1917;--muted:#6b6560;--line:#e7e5e4;--panel:#fff;--accent:#1d4ed8;--sel:#dbeafe}
@media (prefers-color-scheme:dark){:root{--bg:#0c0a09;--fg:#e7e5e4;--muted:#a8a29e;--line:#292524;--panel:#1c1917;--accent:#60a5fa;--sel:#1e3a5f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:1200px;margin:0 auto;padding:20px 16px 96px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:17px;margin:0}
.muted{color:var(--muted);font-size:13px}
.ctx{border-left:3px solid var(--line);padding:4px 12px;margin:6px 0;color:var(--muted);white-space:pre-wrap;font-size:13px;overflow-wrap:anywhere}
.seed{font-size:18px;font-weight:600;margin:10px 0 18px;white-space:pre-wrap;overflow-wrap:anywhere}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.resp{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;white-space:pre-wrap;font-size:13.5px;max-height:62vh;overflow:auto;overflow-wrap:anywhere}
.resp h2{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
label.flag{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 0;margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;padding:8px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;cursor:pointer}
button.pri{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=text]{flex:1;min-width:160px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg)}
pre#out{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);border:1px solid var(--line);padding:12px;border-radius:6px;font-size:12.5px}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<main>
<header><h1>__TITLE__</h1><span class="muted" id="prog"></span></header>
<p class="muted">Each page shows one short message and two replies written for it. Pick the reply that reads you better. Which system wrote which reply is hidden and changes from page to page. Keys: <kbd>a</kbd> <kbd>b</kbd> <kbd>t</kbd> both <kbd>n</kbd> neither <kbd>&larr;</kbd> back. Answers stay in this browser until you export them.</p>
<div id="app"></div>
</main>
<script type="application/json" id="data">__DATA__</script>
<script>
(function(){
"use strict";
var DATA=JSON.parse(document.getElementById("data").textContent);
var PAIRS=DATA.pairs, BUILD=DATA.build_id, STORE="mr-prefer-"+BUILD;
var st={i:0,answers:{}};
try{var saved=JSON.parse(localStorage.getItem(STORE)||"null");if(saved&&saved.answers){st=saved}}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(st))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function result(){return JSON.stringify({build_id:BUILD,answers:st.answers},null,1)}
function done(){
  var app=document.getElementById("app");
  var n=Object.keys(st.answers).length;
  app.innerHTML='<p>'+n+' of '+PAIRS.length+' answered. Export the answers, then score them with <code>prefer score &lt;answers.json&gt;</code>.</p>'+
    '<pre id="out">'+esc(result())+'</pre><div class="bar"><button class="pri" id="dl">Download answers.json</button>'+
    '<button id="cp">Copy</button><button id="back">Back</button><span class="muted" id="msg"></span></div>';
  document.getElementById("dl").onclick=function(){
    var blob=new Blob([result()],{type:"application/json"});var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download="answers-"+BUILD+".json";document.body.appendChild(a);a.click();a.remove();
  };
  document.getElementById("cp").onclick=function(){
    var msg=document.getElementById("msg");
    try{navigator.clipboard.writeText(result()).then(function(){msg.textContent="Copied"},function(){msg.textContent="Select the text above and copy it"})}
    catch(e){msg.textContent="Select the text above and copy it"}
  };
  document.getElementById("back").onclick=function(){st.i=Math.max(0,PAIRS.length-1);save();render()};
}
function pick(p,choice){
  st.answers[p.id]={pick:choice,wrong:["A","B"].filter(function(k){return document.getElementById("w"+k).checked}),note:document.getElementById("note").value};
  st.i++;save();render();window.scrollTo(0,0);
}
function render(){
  var n=PAIRS.length;
  document.getElementById("prog").textContent=Math.min(st.i+1,n)+" / "+n;
  if(st.i>=n){done();return}
  var p=PAIRS[st.i],a=st.answers[p.id]||{};
  var ctx=(p.context&&p.context.length)?'<div class="muted">Earlier in the session</div>'+p.context.map(function(c){return '<div class="ctx">'+esc(c)+'</div>'}).join(""):"";
  var cols=["A","B"].map(function(k){
    return '<div><div class="resp"><h2>Reply '+k+'</h2>'+esc(p[k])+'</div><label class="flag"><input type="checkbox" id="w'+k+'" '+((a.wrong||[]).indexOf(k)>=0?"checked":"")+'> '+k+' assumed something wrong</label></div>';
  }).join("");
  document.getElementById("app").innerHTML=ctx+'<div class="seed">'+esc(p.seed)+'</div><div class="grid">'+cols+'</div>'+
    '<div class="bar"><button data-p="A">A reads me better</button><button data-p="B">B reads me better</button><button data-p="both">Both</button><button data-p="neither">Neither</button>'+
    '<input type="text" id="note" placeholder="Optional: why" value="'+esc(a.note||"")+'"><button id="prev" '+(st.i?"":"disabled")+'>Back</button></div>';
  Array.prototype.forEach.call(document.querySelectorAll("button[data-p]"),function(b){
    if(a.pick===b.getAttribute("data-p"))b.classList.add("pri");
    b.onclick=function(){pick(p,b.getAttribute("data-p"))};
  });
  document.getElementById("prev").onclick=function(){st.i=Math.max(0,st.i-1);save();render()};
}
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.tagName==="INPUT"&&e.target.type==="text")return;
  if(st.i>=PAIRS.length)return;
  var p=PAIRS[st.i],m={a:"A",b:"B",t:"both",n:"neither"}[e.key];
  if(m){pick(p,m)}else if(e.key==="ArrowLeft"&&st.i){st.i--;save();render()}
});
render();
})();
</script>
</body>
</html>
